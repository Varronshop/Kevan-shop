<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1769e0">
<meta name="description" content="KEVAN SHOP — Gestion des ventes, unités, stock et caisse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Kevan Shop</title>
<style>
:root{--blue:#1769e0;--dark:#10213b;--bg:#f4f7fb;--green:#16a36a;--red:#e5484d;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17233a}
header{background:linear-gradient(135deg,#0d47a1,#2186ff);color:white;padding:22px 18px 28px;border-radius:0 0 24px 24px}
.brand{font-size:25px;font-weight:800}.subtitle{opacity:.85;margin-top:5px}
.container{max-width:1100px;margin:auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-12px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 5px 18px #17365d12}
.label{font-size:13px;color:#718096}.value{font-size:22px;font-weight:800;margin-top:8px}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
nav{display:flex;gap:8px;overflow:auto;margin:18px 0}
nav button{border:0;background:white;padding:11px 15px;border-radius:12px;white-space:nowrap;font-weight:700;color:#40516b;cursor:pointer}
nav button.active{background:var(--blue);color:white}
section{display:none}.active-section{display:block}
.panel{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #17365d0d}
h2{margin:0 0 15px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
input,select{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:10px;font-size:14px}
button.primary{background:var(--blue);color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1f6}th{color:#687891}
.badge{padding:5px 8px;border-radius:8px;font-size:12px;font-weight:700}.in{background:#e5f8ef;color:#087a4d}.out{background:#ffe9e9;color:#b72f35}
.operator-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.operator{padding:16px;border-radius:14px;background:#f7faff;border:1px solid #e2ebf7}
.empty{color:#8492a6;text-align:center;padding:25px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.operator-grid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.value{font-size:18px}table{font-size:12px}}
</style>
<style>
.install{position:fixed;right:14px;bottom:14px;z-index:20;background:#1769e0;color:#fff;border:0;border-radius:50px;padding:13px 17px;font-weight:800;box-shadow:0 8px 25px #0003;display:none}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#10213b;color:white;padding:12px 16px;border-radius:12px;display:none;z-index:30}
</style></head>
<body>
<header><div class="container"><div class="brand">KEVAN SHOP</div><div class="subtitle">Gestion des ventes • unités • caisse • stock</div></div></header>
<div class="container">
<div class="cards">
<div class="card"><div class="label">Solde caisse</div><div id="cash" class="value blue">0 FC</div></div>
<div class="card"><div class="label">Ventes</div><div id="sales" class="value green">0 FC</div></div>
<div class="card"><div class="label">Dépenses</div><div id="expenses" class="value red">0 FC</div></div>
<div class="card"><div class="label">Bénéfice brut</div><div id="profit" class="value green">0 FC</div></div>
</div>

<nav>
<button class="active" onclick="show('dashboard',this)">🏠 Tableau de bord</button>
<button onclick="show('sale',this)">📤 Vente / Sortie</button>
<button onclick="show('entry',this)">📥 Entrée</button>
<button onclick="show('expense',this)">💸 Dépense</button>
<button onclick="show('stock',this)">📦 Stock</button>
<button onclick="show('reports',this)">📊 Rapports</button>
</nav>

<section id="dashboard" class="active-section">
<div class="panel"><h2>Stock par opérateur</h2><div id="operators" class="operator-grid"></div></div>
<div class="panel"><h2>Dernières opérations</h2><div id="recent"></div></div>
</section>

<section id="sale">
<div class="panel"><h2>Enregistrer une vente</h2>
<div class="grid">
<div><label>Opérateur</label><select id="saleOp"></select></div>
<div><label>Montant (FC)</label><input id="saleAmount" type="number" min="0" placeholder="5000"></div>
<div><label>Numéro client</label><input id="salePhone" placeholder="08..."></div>
<div><label>Produit</label><select id="saleProduct"><option>Unités</option><option>Forfait Internet</option><option>Minutes</option><option>SMS</option></select></div>
</div><br><button class="primary" onclick="addSale()">Enregistrer la vente</button></div>
</section>

<section id="entry">
<div class="panel"><h2>Enregistrer une entrée de stock</h2>
<div class="grid">
<div><label>Opérateur</label><select id="entryOp"></select></div>
<div><label>Montant (FC)</label><input id="entryAmount" type="number" min="0" placeholder="100000"></div>
<div><label>Fournisseur / source</label><input id="entrySource" placeholder="Achat grossiste"></div>
<div><label>Référence</label><input id="entryRef" placeholder="FAC-001"></div>
</div><br><button class="primary" onclick="addEntry()">Enregistrer l'entrée</button></div>
</section>

<section id="expense">
<div class="panel"><h2>Enregistrer une dépense</h2>
<div class="grid">
<div><label>Motif</label><input id="expReason" placeholder="Transport, loyer..."></div>
<div><label>Montant (FC)</label><input id="expAmount" type="number" min="0" placeholder="5000"></div>
</div><br><button class="primary" onclick="addExpense()">Enregistrer la dépense</button></div>
</section>

<section id="stock">
<div class="panel"><h2>État du stock</h2><div id="stockTable"></div></div>
</section>

<section id="reports">
<div class="panel"><h2>Rapport des opérations</h2><div id="report"></div><br><button class="primary" onclick="resetData()">Réinitialiser les données de démonstration</button></div>
</section>
</div>

<script>
const OPS=["Airtel","Vodacom","Orange","Africell"];
let data=JSON.parse(localStorage.getItem("kevanShop"))||{
cash:0,sales:0,expenses:0,stock:{Airtel:0,Vodacom:0,Orange:0,Africell:0},ops:[]
};
const money=n=>new Intl.NumberFormat('fr-FR').format(n||0)+" FC";
function save(){localStorage.setItem("kevanShop",JSON.stringify(data));render()}
function fillSelects(){["saleOp","entryOp"].forEach(id=>document.getElementById(id).innerHTML=OPS.map(o=>`<option>${o}</option>`).join(""))}
function render(){
document.getElementById("cash").textContent=money(data.cash);
document.getElementById("sales").textContent=money(data.sales);
document.getElementById("expenses").textContent=money(data.expenses);
document.getElementById("profit").textContent=money(data.sales-data.expenses);
document.getElementById("operators").innerHTML=OPS.map(o=>`<div class="operator"><b>${o}</b><div class="value blue">${money(data.stock[o])}</div><small>Stock disponible</small></div>`).join("");
document.getElementById("stockTable").innerHTML=`<table><tr><th>Opérateur</th><th>Stock</th></tr>${OPS.map(o=>`<tr><td>${o}</td><td>${money(data.stock[o])}</td></tr>`).join("")}</table>`;
let rows=data.ops.slice(-12).reverse().map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${x.op||"-"}</td><td>${money(x.amount)}</td></tr>`).join("");
document.getElementById("recent").innerHTML=rows?`<table><tr><th>Date</th><th>Type</th><th>Opérateur</th><th>Montant</th></tr>${rows}</table>`:`<div class="empty">Aucune opération enregistrée.</div>`;
document.getElementById("report").innerHTML=`<table>
<tr><th>Indicateur</th><th>Montant</th></tr>
<tr><td>Total des entrées</td><td>${money(data.ops.filter(x=>x.type==="Entrée").reduce((a,x)=>a+x.amount,0))}</td></tr>
<tr><td>Total des ventes</td><td>${money(data.sales)}</td></tr>
<tr><td>Total des dépenses</td><td>${money(data.expenses)}</td></tr>
<tr><td><b>Bénéfice brut</b></td><td><b>${money(data.sales-data.expenses)}</b></td></tr>
<tr><td><b>Solde caisse</b></td><td><b>${money(data.cash)}</b></td></tr>
</table>`;
}
function addSale(){
let op=saleOp.value,a=+saleAmount.value;
if(!a)return alert("Entrez un montant.");
if(data.stock[op]<a)return alert("Stock insuffisant pour "+op+".");
data.stock[op]-=a;data.sales+=a;data.cash+=a;
data.ops.push({date:new Date().toLocaleString("fr-FR"),type:"Vente",op,amount:a});
saleAmount.value="";salePhone.value="";save();alert("Vente enregistrée.");
}
function addEntry(){
let op=entryOp.value,a=+entryAmount.value;
if(!a)return alert("Entrez un montant.");
data.stock[op]+=a;data.ops.push({date:new Date().toLocaleString("fr-FR"),type:"Entrée",op,amount:a});
entryAmount.value="";entrySource.value="";entryRef.value="";save();alert("Entrée enregistrée.");
}
function addExpense(){
let a=+expAmount.value,r=expReason.value||"Autre dépense";
if(!a)return alert("Entrez un montant."); if(data.cash<a)return alert("Solde caisse insuffisant.");
data.expenses+=a;data.cash-=a;data.ops.push({date:new Date().toLocaleString("fr-FR"),type:"Dépense",op:r,amount:a});
expAmount.value="";expReason.value="";save();alert("Dépense enregistrée.");
}
function show(id,btn){document.querySelectorAll("section").forEach(s=>s.classList.remove("active-section"));document.getElementById(id).classList.add("active-section");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}
function resetData(){if(confirm("Effacer toutes les données ?")){localStorage.removeItem("kevanShop");location.reload()}}
fillSelects();render();
</script>
<button id="installBtn" class="install">📲 Installer KEVAN SHOP</button><div id="toast" class="toast"></div>
<script>
let deferredPrompt;
const ib=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;ib.style.display='block';});
ib.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.style.display='none';});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body>
</html>
